name: pocketsite_ai
description: "Repair Intake Assistant - Offline-first laptop repair shop intake, lifecycle tracking, and on-device OCR."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: 3.0.3
  riverpod_annotation: 3.0.3
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  google_mlkit_text_recognition: ^0.16.0
  camera: ^0.12.0+2
  image_picker: ^1.1.2
  path_provider: ^2.1.6
  uuid: ^4.6.0
  share_plus: 12.0.1
  file_picker: 11.0.1
  archive: ^4.0.2
  intl: ^0.20.2
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: 3.0.3
  build_runner: 2.8.0

flutter:
  uses-material-design: true
